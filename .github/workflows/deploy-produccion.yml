name: Deploy producción

# Disparado por API (workflow_dispatch), no por push — así n8n puede pedir un
# redeploy justo después de publicar un post, sin que cada commit a main
# dispare una publicación a un docroot compartido con WordPress/CRM/etc.
# Ver web/scripts/deploy-produccion.sh — este workflow solo lo envuelve para
# poder llamarlo por HTTPS; la lógica de build/guardas/rsync vive ahí.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: web
        run: yarn install --frozen-lockfile

      - name: Escribir web/.env
        working-directory: web
        run: |
          cat > .env <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SNAPSHOT_SECRET=${{ secrets.SNAPSHOT_SECRET }}
          SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }}
          EOF

      - name: Configurar acceso SSH (llave dedicada de CI, no la personal de nadie)
        run: |
          install -d -m 700 ~/.ssh
          # DEPLOY_SSH_KEY is the private key base64-encoded to one line —
          # pasting a raw multi-line PEM into a GitHub secret is a common way
          # to mangle line breaks and get "error in libcrypto" at load time.
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/procorp_ci_deploy
          chmod 600 ~/.ssh/procorp_ci_deploy
          ssh-keyscan -p 22 "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host procorp-portal
            HostName ${{ secrets.DEPLOY_SSH_HOST }}
            Port 22
            User ${{ secrets.DEPLOY_SSH_USER }}
            IdentityFile ~/.ssh/procorp_ci_deploy
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy a producción
        working-directory: web
        run: ./scripts/deploy-produccion.sh --yes

      # Only reached if the deploy step above succeeded (a failed step skips
      # the rest of the job by default). Closes the one manual step
      # deploy-produccion.sh's own final message calls out: Sucuri sits in
      # front of the origin and can keep serving the previous build until
      # its cache is purged. continue-on-error: the site is already
      # published either way — a failed purge just means Sucuri catches up
      # on its own TTL instead of instantly.
      #
      # Runs the curl from the production server itself over the same SSH
      # connection, not from the runner directly — Sucuri's WAF blocked the
      # first attempt as "Fake bot access" when it came straight from a
      # GitHub Actions IP.
      - name: Purgar caché de Sucuri
        continue-on-error: true
        env:
          SUCURI_API_KEY: ${{ secrets.SUCURI_API_KEY }}
          SUCURI_API_SECRET: ${{ secrets.SUCURI_API_SECRET }}
        run: |
          ssh -o BatchMode=yes procorp-portal \
            "curl -sS -X POST 'https://wafx.sucuri.net/api?v2' --data-urlencode 'k=${SUCURI_API_KEY}' --data-urlencode 's=${SUCURI_API_SECRET}' --data-urlencode 'a=clear_cache'"
